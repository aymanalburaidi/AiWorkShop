.btn:disabled{opacity:.45}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const device = store.get('device', null) || (() => { const d = uid(); store.set('device', d); return d; })();
let toastT;
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast' + (err ? ' err' : ''), 2600); }

/* ---------- الاسم ---------- */
const nameEl = $('#name');
nameEl.value = store.get('name', '');
nameEl.addEventListener('input', () => store.set('name', nameEl.value.trim()));

/* ---------- الأوامر الجاهزة ---------- */
$('#prompts').innerHTML = D.prompts.map((p, i) => `<details class="prompt"><summary>${p.title.replace(/</g,'&lt;')}${ico('i-next')}</summary><p></p><button class="btn copy" data-i="${i}">${ico('i-copy')}<span>${D.copy}</span></button></details>`).join('');
document.querySelectorAll('details.prompt p').forEach((p, i) => p.textContent = D.prompts[i].text);
document.querySelectorAll('.copy').forEach(b => b.onclick = async () => {
  const txt = D.prompts[b.dataset.i].text;
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length); try { ok = document.execCommand('copy'); } catch (_) {} ta.remove();
  }
  if (ok) { b.querySelector('span').textContent = D.copied; setTimeout(() => b.querySelector('span').textContent = D.copy, 1600); }
});

/* ---------- المشاركة ---------- */
const bodyEl = $('#body'), sendBtn = $('#send');
bodyEl.addEventListener('input', () => $('#count').textContent = bodyEl.value.length + '/600');
function renderSent(){
  $('#sent').innerHTML = '';
  store.get('sent', []).slice(-5).reverse().forEach(t => { const d = document.createElement('div'); d.textContent = t; $('#sent').append(d); });
}
renderSent();

/* ---------- الاتصال ---------- */
let sb = null, state = { mode: 'idle', poll_key: null };
function setStatus(on){ $('#status').classList.toggle('on', on); $('#statusTxt').textContent = on ? 'متصلة بالعرض' : D.t.offline; }

sendBtn.onclick = async () => {
  const body = bodyEl.value.trim();
  if (!body || !sb) return;
  sendBtn.disabled = true;
  const { error } = await sb.from('aiws_posts').insert({ room: D.room, device, author: nameEl.value.trim() || null, body });
  sendBtn.disabled = false;
  if (error) { toast(/rate_limited/.test(error.message) ? D.t.error_rate : D.t.error_net, true); return; }
  const sent = store.get('sent', []); sent.push(body); store.set('sent', sent.slice(-20));
  bodyEl.value = ''; $('#count').textContent = '0/600'; bodyEl.blur();
  renderSent(); toast(D.t.share_sent);
};

function renderState(){
  const slot = $('#pollSlot');
  const p = state.mode === 'poll' && D.polls[state.poll_key] ? state.poll_key : null;
  $('#welcome').style.display = state.mode === 'idle' && !p ? '' : 'none';
  if (!p) { slot.innerHTML = ''; slot.dataset.p = ''; return; }
  if (slot.dataset.p === p) return;
  slot.dataset.p = p;
  const poll = D.polls[p], voted = store.get('voted', {})[p];
  slot.innerHTML = `<section class="card poll-card"><span class="pulse">تصويت الآن</span><h2>${poll.question.replace(/</g,'&lt;')}</h2>
    <div class="opts ${voted !== undefined ? 'done' : ''}">${poll.options.map((o, i) => `<button class="opt ${voted === i ? 'picked' : ''}" data-i="${i}"><span class="n">${i + 1}</span><span>${o.replace(/</g,'&lt;')}</span></button>`).join('')}</div>
    <div class="done-msg" ${voted === undefined ? 'hidden' : ''}>${ico('i-check-circle')}<span>${D.t.poll_done}</span></div></section>`;
  slot.querySelectorAll('.opt').forEach(b => b.onclick = () => vote(p, Number(b.dataset.i), slot));
  if (state.mode === 'poll') slot.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
async function vote(p, i, slot){
  const voted = store.get('voted', {});
  if (voted[p] !== undefined || !sb) return;
  const opts = slot.querySelector('.opts');
  opts.classList.add('done'); opts.children[i].classList.add('picked');
  if (navigator.vibrate) navigator.vibrate(15);
  const { error } = await sb.from('aiws_votes').insert({ room: D.room, poll_key: p, choice: i, device });
  if (error && error.code !== '23505') { opts.classList.remove('done'); opts.children[i].classList.remove('picked'); toast(D.t.error_net, true); return; }
  voted[p] = i; store.set('voted', voted);
  slot.querySelector('.done-msg').hidden = false;
}

async function fetchState(){
  if (!sb) return;
  const { data, error } = await sb.from('aiws_state').select('mode,poll_key').eq('room', D.room).maybeSingle();
  if (!error && data) { state = data; renderState(); }
}
function connect(){
  if (!window.supabase) { setTimeout(connect, 400); return; }
  sb = window.supabase.createClient(D.url, D.key, { auth: { persistSession: false } });
  fetchState();
  sb.channel('aiws-phone-' + device.slice(0, 8))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'aiws_state', filter: 'room=eq.' + D.room }, ({ new: s }) => { if (s && s.mode) { state = s; renderState(); } })
    .subscribe(st => setStatus(st === 'SUBSCRIBED'));
  const presence = sb.channel('aiws-room-' + D.room, { config: { presence: { key: device } } });
  presence.subscribe(st => { if (st === 'SUBSCRIBED') presence.track({ role: 'phone' }); });
  // iPhone يوقف الاتصال عند قفل الشاشة؛ نحدّث الحالة عند العودة ودوريًا
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchState(); });
  setInterval(fetchState, 15000);
}
setStatus(false);
renderState();
window.addEventListener('load', connect);
</script>
</body>
</html>
